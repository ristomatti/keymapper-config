  Numpad0       >> Meta{0}
  Numpad1       >> Meta{1}
  Numpad2       >> Meta{2}
  Numpad3       >> Meta{3}
  Numpad4       >> Meta{4}
  Numpad5       >> Meta{5}
  Numpad6       >> Meta{6}
  Numpad7       >> Meta{7}
  Numpad8       >> Meta{8}
  Numpad9       >> Meta{9}
  NumpadDecimal >> Meta{9}
  NumpadAdd     >> Meta{Equal}
  NumpadEnter   >> Meta{1}
  Home          >> Meta{BracketLeft}
  End           >> Meta{G}
  Insert        >> Meta{O}
  Delete        >> Meta{S}
  PageUp        >> $(i3-msg "scratchpad show scratchpad show")
  PageDown      >> $(i3-msg "scratchpad show")

  ArrowUp       >> Escape NumpadRofiMode Meta{N}
  ArrowDown     >> Meta{N} ^ Escape
  ArrowLeft     >> Meta{Shift{Tab}}
  ArrowRight    >> Meta{Tab}

[device = NumpadApayado]
  Numpad1       >> 1
  Numpad2       >> 2
  Numpad3       >> 3
  Numpad4       >> 4
  Numpad5       >> 5
  Numpad6       >> 6
  Numpad7       >> 7
  Numpad8       >> 8
  Numpad9       >> 9
  Numpad0       >> 0
  NumpadSymbol  >> NumpadSymbol
  ScrollLock    >> NumpadNavMode
  NumLock       >> launch_calculator


# Mouse buttons // Logitech G502 X
[device = MouseG502X, class = "xreader"]
  Hold[ButtonSide]          >> ButtonMiddle

[device = MouseG502X]
  DoubleTap[ButtonSide]     >> wm_floating_toggle
  ButtonForward{120ms}      >> mouse_drag
  ButtonBack{120ms}         >> mouse_drag_resize

# Keyboard shortcuts while button side held
[modifier = "ButtonSide"]
  S                         >> wm_sticky_toggle
  1                         >> wm_resize_window_2160p
  2                         >> wm_resize_window_1440p
  3                         >> wm_resize_window_1080p
  4                         >> wm_resize_window_720p
  5                         >> wm_resize_window_1200p
