  1                         >> wm_resize_window_2160p
  2                         >> wm_resize_window_1080p
  3                         >> wm_resize_window_720p
  4                         >> wm_resize_window_16_10
  5                         >> wm_resize_window
  6                         >> wm_resize_window_wide

