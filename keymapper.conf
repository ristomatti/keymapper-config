[modifier = MouseScrollLock]
  ContextActive             >> i3Mode["Scroll"]

  MouseButton               >> ^ $(kctl --release MouseScrollLock)
  Escape                    >> MouseScrollLock

  Shift{J}                  >> _ PageDown
  Shift{K}                  >> _ PageUp
  H                         >> _ Control{Home}
  L                         >> _ Control{End}
  J                         >> _ repeat[WheelDown, 2]
  K                         >> _ repeat[WheelUp, 2]

[default]
  MouseScrollLock           >> ButtonForward


# Mouse buttons // All mice
[device = AnyMouse, modifier = "Shift"]
  WheelLeft                 >> WheelLeft
  WheelRight                >> WheelRight

[device = AnyMouse, title = "spotify_player"]
  ButtonLeft                >> spotify_player_play
  ButtonBack                >> spotify_player_previous
  ButtonForward             >> spotify_player_next
  WheelLeft                 >> spotify_player_rewind
  WheelRight                >> spotify_player_fastfwd

  spotify_player_play       >> Space
  spotify_player_previous   >> P
  spotify_player_next       >> N
  spotify_player_rewind     >> '<'
  spotify_player_fastfwd    >> '>'

[device = AnyMouse]
  Meta{ButtonLeft}          >> wm_floating_toggle
  Meta{ButtonRight}         >> wm_move_to_scratchpad
  Meta{ButtonMiddle}        >> wm_close_window

  Meta{WheelLeft}           >> Meta{DirLeft}
  Meta{WheelRight}          >> Meta{DirRight}
  WheelLeft                 >> prev_tab
  WheelRight                >> next_tab


# Kitty terminal
[class = Terminal]
  ContextActive               >> context["class = Terminal"]

  KittyMod = Z
  Hold[KittyMod]              >> (Control Shift)

  (Control Shift Alt){T}      >> kitty_set_tab_title
  (Control Alt){T}            >> kitty_new_tab
  (Control Alt){BracketRight} >> kitty_next_tab
  (Control Alt){BracketLeft}  >> kitty_prev_tab

  (Control Alt){Minus}        >> kitty_hsplit
  (Control Alt){Backslash}    >> kitty_vsplit
  (Control Alt){F}            >> kitty_toggle_stack_layout
  (Control Alt){O}            >> kitty_layout_rotate
  (Control Alt){R}            >> kitty_resize_pane

