  WheelLeft                 >> $(i3-msg "workspace previous")
  WheelRight                >> $(i3-msg "workspace next")


# Mouse scroll lock
[device = MouseG502X, modifier = "!Modifier"]
  # ContextActive             >> context["device = MouseG502X, modifier = !Modifier"]

  Press[ButtonRight]        >> ButtonRight
  ButtonRight               >> !ButtonRight MouseScrollLock ^ MouseScrollLock

[modifier = MouseScrollLock]
  ContextActive             >> i3Mode["Scroll"]

  MouseButton               >> MouseScrollLock
  Escape                    >> MouseScrollLock

  Shift{J}                  >> _ PageDown
  Shift{K}                  >> _ PageUp
  H                         >> _ Control{Home}
  L                         >> _ Control{End}
  J                         >> repeat[ArrowDown, 6]
  K                         >> repeat[ArrowUp, 6]

[default]
  MouseScrollLock           >> ButtonForward


# Mouse buttons // All mice
[device = AnyMouse, modifier = "Shift"]
  WheelLeft                 >> WheelLeft
  WheelRight                >> WheelRight

[device = AnyMouse]
  Meta{ButtonLeft}          >> wm_float_window
  Meta{ButtonRight}         >> wm_move_to_scratchpad
  Meta{ButtonMiddle}        >> wm_close_window

  Meta{WheelLeft}           >> Meta{KeyLeft}
  Meta{WheelRight}          >> Meta{KeyRight}
  WheelLeft                 >> prev_tab
  WheelRight                >> next_tab


# Tmux scratchpad
[class = "tmux", modifier = "!Control !Alt MetaRight"]
