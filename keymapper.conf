  Shift{Enter}              >> TmuxCommand[Backslash]
  Enter                     >> TmuxCommand[Minus]
  Shift{Direction}          >> TmuxCommand[Shift{Direction}]
  Direction                 >> TmuxCommand[Direction]
  Digit                     >> TmuxCommand[Digit]
  Backslash                 >> TmuxCommand[Backslash]
  Minus                     >> TmuxCommand[Minus]
  Shift{Tab}                >> TmuxCommand[P]
  Tab                       >> TmuxCommand[N]
  C                         >> TmuxCommand[C]
  N                         >> TmuxCommand[N]
  P                         >> TmuxCommand[P]
  Z                         >> TmuxCommand[Z]
  MetaRight{Any}            >> Meta{Any}


