#
# keymapper version >=4.8.1
#
@skip-device "TPPS/2 Elan TrackPoint"
@allow-unmapped-commands
@enforce-lowercase-commands
@forward-modifiers AltRight

# Debug log file
LOG_FILE = "~/tmp/keymapper.log"

# Gnome keyboard settings
KEY_REPEAT_DELAY    = 300
KEY_REPEAT_INTERVAL = 8

# External display brightness
DDC_BRIGHTNESS_INCREMENT = 2

# Input source ids
GNOME_INPUT_SOURCE_US = 0
GNOME_INPUT_SOURCE_FI = 1

@include "include/class_matchers.conf"
@include "include/device_matchers.conf"

@include "include/state_indicators.conf"
@include "include/utils.conf"

@include "include/virtual_modifiers.conf"
@include "include/key_aliases.conf"
@include "include/key_sequences.conf"

@include "include/text_expansion.conf"

# Startup sequence
[default]
  ContextActive          >> on_startup
  on_startup             >> createStateDir applyInputDeviceConfig

# ------------ STAGE 1 ------------

[default]
  ContextActive          >> stage1["stage 1"]

# Edit mode
[modifier = "EditMode"]
  ContextActive          >> i3Mode["Edit"]
  ExitEditMode           =  I | V | Edit | Escape | Exec
  CursorUp               >> ArrowUp
  CursorLeft             >> ArrowLeft
  CursorDown             >> ArrowDown
  CursorRight            >> ArrowRight
  Space                  >> Space
  B                      >> Control{ArrowLeft}
  W                      >> Control{ArrowRight}
  U                      >> Control{Z}
  D                      >> Delete
  'gh'                   >> Home
  'gl'                   >> End
  'gg'                   >> Control{Home}
  'ge'                   >> Control{End}
  ExitEditMode           >> EditMode

# Navigation mode
[modifier = "NavigationMode"]
  ContextActive          >> i3Mode["Navigate"]
  ExitNavigationMode     =  Navigate | Escape | Exec
  Control{CursorUp}      >> _ repeat[WheelUp, 3]
  Control{CursorDown}    >> _ repeat[WheelDown, 3]
  CursorUp               >> _ repeat[WheelUp, 2]
  CursorDown             >> _ repeat[WheelDown, 2]
  CursorLeft             >> _ Home
  CursorRight            >> _ End
  U                      >> _ PageUp
  D                      >> _ PageDown
  Navigate               >> NavigationMode
  Escape                 >> NavigationMode
  Exec                   >> NavigationMode

# Alpha modifiers
[modifier = "!Modifier !NavigationMode !EditMode !SpaceMeta"]
  ? Tap[Edit]            >> Edit
  Hold[Edit]             >> EditMode ^ EditMode
  ? Tap[I]               >> I
  Hold[I]                >> EditMode ^
  ? Tap[Navigate]        >> Navigate
  Hold[Navigate]         >> NavigationMode ^

# Tmux modifier
[title = /tmux/, modifier = "!Modifier !SpaceMeta"]
  ? Tap[Tmux]            >> Tmux
  Hold[Tmux]             >> TmuxMode ^ TmuxMode

# Mirror numpad keys for left hand use
[device = NumpadApayado]
  ContextActive          >> stage1["device = NumpadApayado"]
  Numpad1                >> Numpad3
  Numpad3                >> Numpad1
  Numpad4                >> Numpad6
  Numpad6                >> Numpad4
  Numpad7                >> Numpad9
  Numpad9                >> Numpad7
  NumpadSymbol           >> NumpadSymbol

# Space as Meta
[modifier = "SpaceMeta"]
  ContextActive          >> stage1["modifier = SpaceMeta"]
  Space                  >> SpaceMeta   # release when SpaceMeta gets "stuck"
  SpaceLeft              >> Meta{Space}
  Exec                   >> !Exec (Meta Escape)
  Any                    >> (Meta Any)

[modifier = "!Modifier"]
  Press[Space]           >> Space
  Hold[Space]            >> SpaceMeta ^ SpaceMeta

[default]
  Space                  >> Space
  Exec{!100ms}           >> !Exec Escape
  Exec                   >> !Exec Alt

[device = KeyboardK15Pro]
  ContextActive          >> stage1["device = KeyboardK15Pro"]
  Tap[SpaceLeft]         >> Space

# Send Exec rather than Alt to avoid bringing up file menu
[device = KeyboardK15Pro, class = Slack]
[device = KeyboardK15Pro, class = Obsidian]
[device = KeyboardK15Pro, title = /Microsoft Teams$/i, modifier = "!Alt"]
  (Exec Shift){Any}      >> Exec{Shift{Any}}
  (Exec Control){Any}    >> Exec{Control{Any}}
  Exec{Any}              >> Exec{Any}

[device = KeyboardK3Pro]
  ContextActive          >> stage1["device = KeyboardK3Pro"]
  Tap[ControlRight]      >> Escape

[device = KeyboardStandard]
  ContextActive          >> stage1["device = KeyboardStandard"]
  Press[CapsLock]        >> Escape
  CapsLock !75ms Alpha   >> ControlRight{Alpha}
  CapsLock               >> ControlRight
  IntlBackslash          >> Backslash

# pvetui
[class = Terminal, title = /^pvetui$/]
  ContextActive          >> stage1["class = Terminal, title = pvetui"]
  2                      >> 2

[class = Terminal, modifier = "!Modifier Exec"]
  # ContextActive          >> stage1["modifier = Exec, class = Terminal"]
  P                      >> _ Paste
  2                      >> '""' ArrowLeft
  Quote                  >> "''" ArrowLeft

[modifier = "Exec"]
  # ContextActive          >> stage1["modifier = Exec"]
  B                      >> navigate_back
  N                      >> navigate_forward
  Home                   >> screenshot
  Insert                 >> !Alt !Insert End
  Modifier               >> !Exec (Modifier Alt)

  navigate_back          >> _ Alt{ArrowLeft}
  navigate_forward       >> _ Alt{ArrowRight}
  screenshot             >> $(flameshot gui) ^

# Mouse Buttons // Logitech Trackball
[device = MouseTrackball]
  ContextActive          >> stage1["device = MouseTrackball"]
  ButtonLeft             >> ButtonRight
  ButtonRight            >> ButtonLeft

[default]
  # Trigger CapsWord on stage 1, otherwise it won't reliably trigger
  ? (ShiftL ShiftR)        >> CapsWord ^
  Meta{Tap[Control]}       >> wm_focus_previous_window
  Control                  >> Control

  wm_focus_previous_window >> $(i3-msg 'exec pkill -USR1 -F "${XDG_RUNTIME_DIR}/swap_focus.pid"') ^

# ------------ STAGE 2 ------------

[stage]
  ContextActive >> context["stage 2"]
  Meta          >> Meta
  Control       >> Control
  Shift         >> Shift
  AltGr         >> AltGr

[class != TeamsForLinux]
  Alt           >> Alt  # Skip forwarding to avoid hidden menu from briefly flashing

# CapsWord modifier (https://docs.qmk.fm/#/feature_caps_word)
[default]
  CapsWordKey = Alpha | Digit | Minus | Backspace
  CapsWord              >> CapsLock ^ CapsLock

[modifier = "CapsWord"]
  ContextActive         >> i3Mode["CapsWord"]
  Minus                 >> Shift{Minus} # '_'
  CapsWordKey           >> CapsWordKey
  Any                   >> CapsWord Any ^


# DirectUmlauts modifier
[default]
  DirectUmlautsTitle = /Pull request|Gmail|Outlook|Slack|WhatsApp|TickTick|Zen|Teams/i
  DirectUmlauts         >> setDirectUmlautsStatusOn ^ setDirectUmlautsStatusOff

[modifier = "!Meta !Control !Alt DirectUmlauts", title = DirectUmlautsTitle]
  Shift{Comma}          >> (Shift Semicolon)
  ShiftRight{2}         >> (Shift Quote)

  Hold[Quote]           >> Quote ^
  Hold[Semicolon]       >> Semicolon ^
  Quote                 >> AltGr{Q}
  Semicolon             >> AltGr{P}


# AutoShift modifier (https://docs.qmk.fm/#/feature_auto_shift)
[default]
  AutoShifted = BracketLeft | BracketRight | Minus | Equal | Comma | Period | Semicolon | Slash | Quote

  AutoShift >> setAutoShiftStatusOn ^ setAutoShiftStatusOff

[modifier = "!Meta !AltGr !Control AutoShift"]
  Shift{AutoShifted}                >> (Shift AutoShifted)
  Digit{140ms} !Digit               >> (Shift Digit)
  AutoShifted{120ms} !AutoShifted   >> (Shift AutoShifted)
  AutoShifted{Any}                  >> AutoShifted Any ^
  AutoShifted                       >> AutoShifted


# Shift and AltGr (ISO Level3 Shift) mappings
[modifier = "!Meta !Control !Alt !SpaceMeta"]
  Shift{4}               >> Shift{4}
  Shift{2}               >> Shift{Quote} # '"'

  AltGr{Semicolon}       >> AltGr{O}     # 'ä'
  AltGr{Quote}           >> AltGr{A}     # 'ö'

  AltGr{E}               >> AltGr{5}     # '€'
  AltGr{1}               >> Shift{1}     # '!'
  AltGr{2}               >> Shift{2}     # '@'
  AltGr{BracketLeft}     >> Shift{9}     # '('
  AltGr{BracketRight}    >> Shift{0}     # ')'
  AltGr{Equal}           >> Shift{Equal} # '+'
  AltGr{Minus}           >> Shift{Slash} # '?'


# Bluetooth headphones
[device = MediaUgreenBTAudio]
[device = MediaWH1000XM3]
  ContextActive >> context["device = MediaWH1000XM3"]
  MediaPlay     >> MediaPlayPause
  MediaPause    >> MediaPlayPause


# Bluetooth camera shutter button (experiment)
[device = MediaShutterButton]
  BTShutterButton = AudioVolumeUp | AudioVolumeDown
  BTShutterButton >> Meta{Tab}


# Barcode reader (experiment)
[device = BarcodeReader]
  0 >> write["0"]
  1 >> write["1"]
  2 >> write["2"]
  3 >> write["3"]
  4 >> write["4"]
  5 >> write["5"]
  6 >> write["6"]
  7 >> write["7"]
  8 >> write["8"]
  9 >> write["9"]

  Enter >> endWrite


# Tmux mode
[modifier = "TmuxMode"]
  ContextActive             >> i3Mode["Tmux"]

  Enter                     >> TmuxCommand[Minus]
  Shift{Direction}          >> TmuxCommand[Shift{Direction}]
  Direction                 >> TmuxCommand[Direction]
  Digit                     >> TmuxCommand[Digit]
  Backslash                 >> TmuxCommand[Backslash]
  Minus                     >> TmuxCommand[Minus]
  Shift{Tab}                >> TmuxCommand[P]
  Tab                       >> TmuxCommand[N]
  C                         >> TmuxCommand[C]
  Z                         >> TmuxCommand[Z]

  # Fallback: exit i3wm mode, send sequence normally
  Meta{Any}                 >> _ Escape !Meta ^ Meta{Any}


# Key definitions // Keychron K15 Pro
[device = KeyboardK15Pro]
  # Rotary encoder
  EncoderButton = NumpadEnter
  EncoderRight  = NumpadAdd
  EncoderLeft   = NumpadSubtract


# Spotify // Keychron keyboards
[device = KeyboardKeychron, class="vlc"]
[device = KeyboardKeychron, class=/Spotify/i]
  ContextActive   >> context["device = KeyboardKeychron, class = /Spotify/i"]

  FnPlayPause     >> MediaPlayPause
  FnRewind        >> MediaTrackPrevious
  FnFastForward   >> MediaTrackNext
  FnMute          >> AudioVolumeMute
  FnVolumeDown    >> AudioVolumeDown
  FnVolumeUp      >> AudioVolumeUp

# Encoder mappings for Rofi // Keychron K15 Pro
[device = KeyboardK15Pro, title = /rofi/i]
  EncoderButton   >> Enter ^
  EncoderRight    >> ArrowDown
  EncoderLeft     >> ArrowUp

[class = Browser, title = "YouTube"]
  Esc{Shift{F}}   >> Period
  Esc{F}          >> Comma

[class = Browser, title = "TIDAL"]
  ContextActive   >> context["class = Browser, title = -TIDAL"]
  FnPlayPause     >> Space
  FnFastForward   >> Control{ArrowRight}
  FnRewind        >> Control{ArrowLeft}
  FnVolumeUp      >> AudioVolumeUp
  FnVolumeDown    >> AudioVolumeDown
  FnMute          >> AudioVolumeMute

[class = Browser, title = /Stylus/i]
  ? '//' >> '*  */' repeat[ArrowLeft, 3]

# LibreChat
[class = LibreChat]
  ContextActive   >> context["class = Browser, title = LibreChat"]
  Control{B}      >> '****' repeat[ArrowLeft, 2]

# scrcpy
[class = "scrcpy"]
  ContextActive   >> context["class = scrcpy"]
  ButtonSide      >> Alt


# Browser // Azure DevOps pull request
[device = KeyboardKeychron, class = Browser, modifier = "!Modifier", title = /Pull request \d+:/i]
  PageUp          >> prev_change
  PageDown        >> next_change

  next_change     >> ^ F7
  prev_change     >> ^ Shift{F7}


[class = Chrome]
  Mod{F11} >> wm_hide_window_chrome


# GitHub Code Spaces // Keychron keyboards
[device = KeyboardKeychron, class = Browser, title = /Visual Studio Code.*GitHub/i]
  Alt{W}                >> close_tab
  Alt{A}                >> command_palette
  Alt{D}                >> goto_definition
  Alt{F}                >> goto_file
  Alt{S}                >> goto_workspace_symbol

  Alt{Any}              >> Alt{Any}
  Control{Any}          >> Control{Any}

  close_tab             >> _ Alt{W}
  command_palette       >> _ Control{Shift{P}}
  goto_definition       >> _ F12
  goto_file             >> _ Control{P}
  goto_workspace_symbol >> _ Control{T}


# Standard keyboard mappings
[device = KeyboardStandard]
  ContextActive         >> context["device = KeyboardStandard"]

  Hold[BracketRight]    >> launch_kitty_scratch
  Press[AltGr]          >> i3Leader


# Default mappings // Keychron keyboards
[device = KeyboardKeychron]
  OneShot[Option, Tab]         >> DirectUmlauts ^
  OneShot[Option, Control]     >> AutoShift ^

  Option{Tab}                  >> DirectUmlauts ^
  Option{ControlRight}         >> AutoShift ^
  Option{BracketLeft}          >> set_keyboard_layout_us
  Option{BracketRight}         >> set_keyboard_layout_fi
  Option{1}                    >> set_keyboard_layout_us
  Option{2}                    >> set_keyboard_layout_fi
  Option{Any}                  >>
  Option                       >>

  Command{Space}               >> show_run_menu
  Command{Tab}                 >> show_window_switcher
  Command{Enter}               >> launch_kitty_scratch
  Command{O}                   >> launch_obsidian
  Command{S}                   >> launch_slack
  Command{Y}                   >> launch_spotify
  Command{M}                   >> launch_yt_music
  Command{W}                   >> launch_whatsapp
  Command{T}                   >> launch_telegram
  Command{Minus}               >> wm_move_to_scratchpad

  # Media keys
  Meta{FnPlayPause}            >> _ MediaPlayPause
  Meta{FnRewind}               >> _ MediaTrackPrevious
  Meta{FnFastForward}          >> _ MediaTrackNext
  Meta{FnMute}                 >> _ AudioVolumeMute
  Meta{FnVolumeDown}           >> _ AudioVolumeDown
  Meta{FnVolumeUp}             >> _ AudioVolumeUp

  # Brightness presets (Macro1 -> 1..6)
  Hyper{1}                     >> brightness_preset_1
  Hyper{2}                     >> brightness_preset_2
  Hyper{3}                     >> brightness_preset_3
  Hyper{4}                     >> brightness_preset_4
  Hyper{5}                     >> brightness_preset_5
  Hyper{6}                     >> brightness_preset_6

  # Color temp presets (Macro1 -> 7..0)
  Hyper{7}                     >> color_temp_preset_1
  Hyper{8}                     >> color_temp_preset_2
  Hyper{9}                     >> color_temp_preset_3
  Hyper{0}                     >> color_temp_preset_4

  # Display brightness / color temperature adjustment
  FnBrightnessReset = FnBrightnessDown | FnBrightnessUp
  FnColorTempReset  = FnColorTempDown | FnColorTempUp

  Meta{FnBrightnessDown}       >> ddc_brightness_decrease
  Meta{FnBrightnessUp}         >> ddc_brightness_increase
  Meta{FnColorTempDown}        >> color_temp_decrease
  Meta{FnColorTempUp}          >> color_temp_increase

  ControlR{FnBrightnessDown}   >> soft_brightness_decrease
  ControlR{FnBrightnessUp}     >> soft_brightness_increase

  AltGr{FnBrightnessReset}     >> brightness_reset
  AltGr{FnColorTempReset}      >> color_temp_reset


# Default mappings // Keychron K3 Pro
[device = KeyboardK3Pro]
  ContextActive                       >> context["device = KeyboardK3Pro"]
  Command{i3LeaderBind}               >> i3Leader{i3LeaderBind}
  Command                             >> i3Leader


# Default mappings // Keychron K15 Pro
[device = KeyboardK15Pro]
  ContextActive                       >> context["device = KeyboardK15Pro"]

  # QMK Macro1+Backquote
  RofiHassScene                       >> show_scene_picker

  Command{Lock}                       >> lock_desktop_session
  Command{i3LeaderBind}               >> i3Leader{i3LeaderBind}
  Command                             >> i3Leader

  # Encoder brigthness and color temperature control
  ControlRight{EncoderButton}         >> soft_brightness_reset
  ControlRight{EncoderRight}          >> soft_brightness_increase
  ControlRight{EncoderLeft}           >> soft_brightness_decrease

  AltGr{EncoderButton}                >> color_temp_reset
  AltGr{EncoderRight}                 >> color_temp_increase
  AltGr{EncoderLeft}                  >> color_temp_decrease

  Hold[Lock]                          >> lock_desktop_session
  DoubleTap[Lock]                     >> lock_desktop_session

  # Encoder audio control
  EncoderButton                       >> MediaPlayPause ^
  EncoderRight                        >> AudioVolumeUp
  EncoderLeft                         >> AudioVolumeDown


# ThinkPad keyboards
[device = KeyboardThinkPad]
  ContextActive                       >> context["device = KeyboardThinkPad"]
  PrintScreen                         >> MetaRight


# Default mappings
[default]
  # Long-press shortcuts
  # TODO: Why did this break after adding apply code above
  # Hold[Backslash]                     >> launch_kitty_scratch

  Hold[F3]                            >> launch_home_assistant
  Hold[F4]                            >> launch_hass_light_tiles

  Hold[Equal]                         >> zoom_in
  Hold[Minus]                         >> zoom_out

  # Mark/goto
  Meta{Shift{M}}                      >> wm_mark_window
  None                                >> wm_mark_window_named
  Hold[M]                             >> wm_mark_window
  None                                >> wm_goto_named_mark
  Mod{G}                              >> wm_goto_mark

  # Window jump/swap
  !Modifier Hold[F, 1.1]              >> wm_jump_to_window
  !Modifier Hold[S, 2.2]              >> wm_swap_with_window

  (Meta Control Shift){Direction}     >> (Meta Control Shift){Direction}
  (Meta Shift){Direction}             >> (Meta Shift){Direction}
  Meta{DirLeft}                       >> $(i3-kitty-focus left)
  Meta{DirRight}                      >> $(i3-kitty-focus right)
  Meta{DirUp}                         >> $(i3-kitty-focus up)
  Meta{DirDown}                       >> $(i3-kitty-focus down)

  Meta{Escape}                        >> $(kt os-overlay -w 1200 -h 800 htop)
  (Meta Shift){Space}                 >> show_window_switcher
  (Meta Control){Space}               >> show_run_menu
  # Meta{Space}                         >> launch_vicinae

  (Meta Control){I}                   >> wm_invert_window_colors
  (Meta Shift){F}                     >> wm_floating_toggle
  Meta{F}                             >> wm_fullscreen_toggle
  Meta{W}                             >> wm_jump_to_window
  Meta{S}                             >> wm_swap_with_window
  Meta{Semicolon}                     >> wm_focus_previous_window

  Meta{Control{D}}                    >> run_scrcpy_audiovideo
  Meta{Shift{D}}                      >> run_scrcpy_audio
  Meta{D}                             >> run_scrcpy_video
  None                                >> run_scrpcpy
  None                                >> scrcpy_connect_tab_s8

  Meta{Shift{Q}}                      >> wm_close_window
  Meta{DoubleTap[Q]}                  >> wm_close_window
  Meta{Q}                             >>

  Meta{Backquote}                     >> wm_show_scratchpad
  Meta{BracketLeft}                   >> launch_librechat
  Meta{BracketRight}                  >> launch_kitty_scratch
  Meta{O}                             >> launch_obsidian
  Meta{G}                             >> launch_telegram
  None                                >> launch_slack
  Meta{Y}                             >> launch_spotify
  Meta{E}                             >> show_emoji_picker
  Meta{Comma}                         >> show_hass_assist

  # Workspace switching
  Meta{P}                             >> Meta{1}
  Meta{M}                             >> Meta{0}

  (Meta Control){Any}                 >> Meta{Control{Any}}

  wm_resize_grow_height               >> $(i3-msg "resize grow height 8 px or 8 ppt")
  wm_resize_grow_width                >> $(i3-msg "resize grow width 8 px or 8 ppt")
  wm_resize_shrink_height             >> $(i3-msg "resize shrink height 8 px or 8 ppt")
  wm_resize_shrink_width              >> $(i3-msg "resize shrink width 8 px or 8 ppt")


# Apayado K33 Numpad
