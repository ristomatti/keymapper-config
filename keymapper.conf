  WheelRight                >> $(i3-msg "workspace next")


# Mouse scroll lock
[device = MouseG502X, modifier = "!Modifier"]
  # ContextActive             >> context["device = MouseG502X, modifier = !Modifier"]

  # Disable below when trackball mouse is not connected
  Press[ButtonRight]        >> ButtonRight
  ButtonRight               >> !ButtonRight MouseScrollLock ^ MouseScrollLock


# Mouse Buttons // Logitech Trackball
[device = MouseTrackball]
  ContextActive              >> context["device = MouseTrackball"]
  DoubleTap[ButtonRight]     >> ButtonBack ^
  DoubleTap[ButtonLeft]      >> ButtonForward ^
  ButtonRight{ButtonLeft}    >> MouseScrollLock ^
  Hold[ButtonForward]        >> MouseScrollLock ^ MouseScrollLock
